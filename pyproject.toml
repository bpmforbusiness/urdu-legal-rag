[project]
name = "urdu-legal-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over Urdu translations of Indian central acts"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "pillow>=10.0",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
index = ["sentence-transformers>=2.7", "faiss-cpu>=1.8"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
